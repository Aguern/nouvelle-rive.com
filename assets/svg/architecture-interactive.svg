<?xml version="1.0" encoding="UTF-8"?>
<svg width="400px" height="400px" viewBox="0 0 400 400" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Architecture Interactive Nouvelle Rive</title>
    
    <!-- Lignes de connexion en arrière-plan -->
    <g id="paths" stroke="#CDD5E7" stroke-width="2">
        <line x1="115" y1="115" x2="180" y2="180" class="arch-path" id="path-data"/>
        <line x1="285" y1="115" x2="220" y2="180" class="arch-path" id="path-connection"/>
        <line x1="200" y1="280" x2="200" y2="220" class="arch-path" id="path-reasoning"/>
    </g>

    <!-- Groupe 1: Fiabilité des Données (Data Science, ML) -->
    <g id="arch-data" class="arch-group" transform="translate(80, 80)">
        <circle class="arch-shape" fill="#FFFFFF" stroke="#CDD5E7" stroke-width="2" cx="15" cy="15" r="30"/>
        <g class="arch-icon" fill="#3898FF" transform="translate(7, 7)">
            <rect x="0" y="0" width="16" height="2.5" rx="1"/>
            <rect x="0" y="6" width="16" height="2.5" rx="1"/>
            <rect x="0" y="12" width="16" height="2.5" rx="1"/>
        </g>
    </g>

    <!-- Groupe 2: Connexion & Action (API, RPA) -->
    <g id="arch-connection" class="arch-group" transform="translate(260, 80)">
        <circle class="arch-shape" fill="#FFFFFF" stroke="#CDD5E7" stroke-width="2" cx="15" cy="15" r="30"/>
        <g class="arch-icon" fill="#3898FF" transform="translate(8, 9)">
            <path d="M4.7,11.3 L0,6.6 L1.4,5.2 L4.7,8.5 L12.5,0.7 L13.9,2.1 L4.7,11.3 Z"/>
            <path d="M12.5,11.3 L8.7,7.5 L10.1,6.1 L12.5,8.5 L18.6,2.4 L20,3.8 L12.5,11.3 Z"/>
        </g>
    </g>

    <!-- Groupe 3: Raisonnement & Orchestration (LangGraph, CoT) -->
    <g id="arch-reasoning" class="arch-group" transform="translate(170, 250)">
        <circle class="arch-shape" fill="#FFFFFF" stroke="#CDD5E7" stroke-width="2" cx="15" cy="15" r="30"/>
        <g class="arch-icon" fill="#3898FF" transform="translate(8, 8)">
             <path d="M2,3 L14,3 M2,8 L14,8 M2,13 L14,13" stroke="#3898FF" stroke-width="2" stroke-linecap="round"/>
        </g>
    </g>

    <!-- Coeur du système (LLM, Deep Learning) -->
    <g id="arch-core" class="arch-group" transform="translate(165, 165)">
        <circle class="arch-shape" fill="#FFFFFF" stroke="#CDD5E7" stroke-width="2" cx="35" cy="35" r="55"/>
        <rect class="arch-icon" fill="#3898FF" x="25" y="25" width="20" height="20" rx="2"/>
        <rect class="arch-icon" fill="#FFFFFF" x="29" y="29" width="12" height="12" rx="1"/>
    </g>
</svg>